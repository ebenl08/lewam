# AnyGoal PushT-Antigoal (external/AnyGoal, anygoal/resources/plan/lewm/push_t_antigoal.yaml): PushT physics with an
# invisible corner target for the T. Offset / budget / callables as AnyGoal's LeWM config.
defaults:
  - base
  - _self_

world:
  env_name: anygoal/PushTAntigoal-v3

dataset:
  keys_to_cache: [action, proprio, state]

eval:
  goal_offset_steps: 25
  eval_budget: 50
  dataset_name: pusht_antigoal_test
  callables:
    - method: _set_state
      args:
        state: {value: state}
    - method: _set_goal_state
      args:
        goal_state: {value: goal_state}
