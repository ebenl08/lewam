# AnyGoal StackT (external/AnyGoal, anygoal/resources/plan/lewm/stackt.yaml): PushT dynamics, the T pushed onto the
# goal T so the two heads overlay. Offset / budget / callables as AnyGoal's LeWM config.
defaults:
  - base
  - _self_

world:
  env_name: anygoal/StackT-v2

dataset:
  keys_to_cache: [action, proprio, state]

eval:
  goal_offset_steps: 25
  eval_budget: 50
  dataset_name: stackt_test
  callables:
    - method: _set_state
      args:
        state: {value: state}
    - method: _set_goal_state
      args:
        goal_state: {value: goal_state}
