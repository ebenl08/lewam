# AnyGoal AvoidT (external/AnyGoal, anygoal/resources/plan/lewm/avoidt.yaml): PushT dynamics, the T block parked
# at a fixed pose and the agent sent to a corner goal around it. Offset / budget / callables as AnyGoal's LeWM config.
defaults:
  - base
  - _self_

world:
  env_name: anygoal/AvoidT-v1

dataset:
  keys_to_cache: [action, proprio, state]

eval:
  goal_offset_steps: 25
  eval_budget: 50
  dataset_name: avoidt_test
  callables:
    - method: _set_state
      args:
        state: {value: state}
    - method: _set_goal_state
      args:
        goal_state: {value: goal_state}
